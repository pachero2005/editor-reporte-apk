name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git ccache tzdata libssl-dev autoconf libtool pkg-config libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev openjdk-17-jdk unzip zip zlib1g-dev python3-dev
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33 virtualenv

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,openpyxl/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
