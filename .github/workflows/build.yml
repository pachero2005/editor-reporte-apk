name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git ccache tzdata libssl-dev autoconf libtool pkg-config libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev openjdk-17-jdk unzip zip zlib1g-dev python3-dev
        pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33 virtualenv setuptools
        python -m pip install "python-for-android>=2024.0" --upgrade

    - name: Build with Buildozer
      run: |
        buildozer init
        # Forzar la versión de python y los requisitos de forma robusta
        sed -i 's/^requirements =.*/requirements = python3,kivy,openpyxl,requests,charset_normalizer==3.0.1/' buildozer.spec
        # Si prefieres quitarle el pin por completo y dejar que p4a elija:
        # sed -i 's/^requirements =.*/requirements = python3,kivy,openpyxl,requests,charset_normalizer/' buildozer.spec
        
        sed -i 's/^#\?p4a.python_recipe = .*/p4a.python_recipe = 3.10/' buildozer.spec
        sed -i 's/^#\?android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^#\?android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#\?android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
