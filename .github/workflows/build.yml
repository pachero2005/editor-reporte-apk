name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git ccache tzdata libssl-dev autoconf libtool pkg-config libffi-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev openjdk-17-jdk unzip zip zlib1g-dev libncurses5 libstdc++6 zlib1g openjdk-17-jdk-headless
        
        # Forzar Java 17 como predeterminado para el plugin de Android
        sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
        sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython==0.29.33 virtualenv setuptools
        python -m pip install "python-for-android>=2024.0" --upgrade

    - name: Build with Buildozer
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        buildozer init
        
        # Ajustar nombre, paquete y configuraciones clave de manera segura
        sed -i 's/^#\?title = .*/title = Libro Diario/' buildozer.spec
        sed -i 's/^#\?package.name = .*/package.name = librodiario/' buildozer.spec
        sed -i 's/^#\?package.domain = .*/package.domain = org.pachero/' buildozer.spec
        
        # Ajustar requisitos asegurando las dependencias completas
        sed -i 's/^requirements =.*/requirements = python3,kivy,openpyxl,requests,charset-normalizer,setuptools/' buildozer.spec
        
        sed -i 's/^#\?p4a.python_recipe = .*/p4a.python_recipe = 3.10/' buildozer.spec
        sed -i 's/^#\?android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^#\?android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#\?android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
        
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
